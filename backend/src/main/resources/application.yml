server:
  port: 8080

spring:
  application:
    name: proj-backend

  # ── Database ──────────────────────────────────────────────
  datasource:
    url: jdbc:h2:file:./data/proj_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false

  # ── Flyway Migrations ────────────────────────────────────
  flyway:
    enabled: false

  # ── RabbitMQ ──────────────────────────────────────────────
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # ── Spring AI (Groq / OpenRouter via OpenAI-compatible API) ──
  ai:
    openai:
      api-key: ${AI_API_KEY:YOUR_GROQ_API_KEY_HERE}
      base-url: ${AI_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: ${AI_MODEL:llama-3.3-70b-versatile}
          temperature: 0.3

# ── JWT ────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:YOUR_LOCAL_DEV_JWT_SECRET_STRING_AT_LEAST_64_CHARACTERS_LONG}
    expiration-ms: 86400000  # 24 hours

# ── Logging ────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.proj: DEBUG
    org.springframework.ai: DEBUG

