<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PROJ — AI-Powered Resume Processing Platform. Upload, analyze, and understand resumes at scale." />
    <meta name="color-scheme" content="dark light" />
    <title>PROJ — AI-Powered Resume Intelligence</title>
    <script>
      // Resolve the theme before first paint (no FOUC). Explicit choice wins,
      // otherwise follow the OS preference. Dark is the product default.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('resumify-theme'); } catch (e) {}
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = (stored === 'light' || stored === 'dark')
          ? stored
          : (prefersLight ? 'light' : 'dark');
        document.documentElement.classList.toggle('light', theme === 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
